<!DOCTYPE html>
<html>
<head>
  <title>Snake</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>snake fun game!🇩🇰</h1>
  <p><a href="index.html">Back to home</a></p>
<canvas id="gameCanvas" width="400" height="400"></canvas>

<img src="https://i.pinimg.com/474x/c9/92/13/c992131f9805234747b09eac49d6316e.jpg">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQDi4YTOzMybbxIQtUaDGc_DV8tfRLUXaBBSqE4NkzLw&s=10">

</body>
 
  <script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var CELL = 20;
 
    var snake = { x: 6, y: 7 };
    var dx = 20; // how far snake.x changes each step
    var dy = 0;  // how far snake.y changes each step
    var body = [];        // every square the snake is made of
    var snakeLength = 3;  // how long it is supposed to be
    var apple = { x: 200, y: 200 };


    

    function drawBoard() {
  ctx.fillStyle = "#FF0000";
  ctx.fillRect(0, 0, 400, 400);
 
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(snake.x, snake.y, 20, 20);

 for (var i = 0; i < body.length; i++) {
    ctx.fillRect(body[i].x, body[i].y, 20, 20);
  }
    
      ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(apple.x, apple.y, 20, 20);
    }
  
    
setInterval(step, 100);
    
function step() {
  snake.x = snake.x + dx;
  snake.y = snake.y + dy;
  drawBoard();
}

   document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowRight") {
    dx = 20;
    dy = 0;
  }
  if (event.key === "ArrowLeft") {
    dx = -20;
    dy = 0;
  }
     if (event.key === "ArrowRight") {
  dx = 20;
  dy = 0;   // yes - turns off any up/down movement
}
if (event.key === "ArrowUp") {
    dx = 0;
    dy = -20;
  }
  if (event.key === "ArrowDown") {
    dx = 0;
    dy = 20;
  }
       if (event.key === "ArrowRight") {
    dx = 20;
    dy = 0;
  }
  if (event.key === "a") {
    dx = -20;
    dy = 0;
  }
     if (event.key === "d") {
  dx = 20;
  dy = 0;   // yes - turns off any up/down movement
}
if (event.key === "w") {
    dx = 0;
    dy = -20;
  }
  if (event.key === "s") {
    dx = 0;
    dy = 20;
  }

});

    function step() {
  snake.x = snake.x + dx;
  snake.y = snake.y + dy;
 
  if (snake.x > 380) { snake.x = 0; }
  if (snake.x < 0) { snake.x = 380; }
  if (snake.y > 380) { snake.y = 0; }
  if (snake.y < 0) { snake.y = 380; }

  if (
  snake.x < apple.x + 20 &&
  snake.x + 20 > apple.x &&
  snake.y < apple.y + 20 &&
  snake.y + 20 > apple.y) 
  {
        snakeLength = snakeLength + 1; 
        apple.x = Math.floor(Math.random() * 20) * 20;
        apple.y = Math.floor(Math.random() * 20) * 20;
      }
      

      body.push({ x: snake.x, y: snake.y });
 
  while (body.length > snakeLength) {
    body.shift();
  }
      
 
  drawBoard();
}

  </script>
</html>
