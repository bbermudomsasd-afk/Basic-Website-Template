  <script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var CELL = 20;
 
    var snake = { x: 6, y: 7 };
 
    function drawBoard() {
  ctx.fillStyle = "#FF0000";
  ctx.fillRect(0, 0, 400, 400);
 
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(snake.x, snake.y, 20, 20);
}
 
setInterval(step, 100);
function step() {
  snake.x = snake.x + 20;
  drawBoard();
}
function step() {
  snake.x = snake.x + 20;
 
  if (snake.x > 380) {
    snake.x = 0;
  }
 
  drawBoard();
}


  </script>
